name: Cross-platform Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-training-tools:
    name: Synthetic corpus tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify dependency-free generator and Python syntax
        run: |
          python -m py_compile tools/cw_key_model/*.py
          python tools/cw_key_model/test_generator.py

  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 x64 / MSVC
            os: windows-2025
            qt-arch: win64_msvc2022_64
            configure-arguments: -A x64
            artifact: cw-assistant-windows11-x64
            marker: windows11-x64
            # Build-tool pin only: remove after a released aqtinstall includes
            # the Qt 6.11 Windows repository-layout fix from this commit.
            aqt_source: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
            portable_archive: false
            windows_installer: true
            debian_package: false
            ort_arch: x64
          - name: Linux x64 / GCC
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
            configure-arguments: ""
            artifact: cw-assistant-linux-x64
            marker: linux-x64
            aqt_source: ""
            portable_archive: true
            windows_installer: false
            debian_package: true
            ort_arch: x64
          - name: macOS ARM64 / Apple Clang
            os: macos-15
            qt-arch: clang_64
            configure-arguments: -DCMAKE_OSX_ARCHITECTURES=arm64
            artifact: cw-assistant-macos-arm64
            marker: macos-arm64
            aqt_source: ""
            portable_archive: true
            windows_installer: false
            debian_package: false
            ort_arch: arm64
          - name: macOS x64 / Apple Clang
            os: macos-15-intel
            qt-arch: clang_64
            configure-arguments: -DCMAKE_OSX_ARCHITECTURES=x86_64
            artifact: cw-assistant-macos-x64
            marker: macos-x64
            aqt_source: ""
            portable_archive: true
            windows_installer: false
            debian_package: false
            ort_arch: x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CWA_ONNXRUNTIME_VERSION: 1.28.2
      CWA_ONNXRUNTIME_COMMIT: 33ca9628233dc8f002435e868d4c2e9f82766ca1
      CWA_ONNXRUNTIME_WINDOWS_SHA256: c4eedd29489d5feca21866d054638416f3655bf6b18851b3b6b85c8313e95c35
      CWA_ONNXRUNTIME_ROOT: ${{ github.workspace }}/.dependencies/onnxruntime-root
      CWA_ONNXRUNTIME_SOURCE: ${{ github.workspace }}/.dependencies/onnxruntime-source
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Restore pinned ONNX Runtime CPU build
        id: cache_onnxruntime
        uses: actions/cache@v5
        with:
          path: ${{ env.CWA_ONNXRUNTIME_ROOT }}
          key: cwa-onnxruntime-${{ env.CWA_ONNXRUNTIME_VERSION }}-${{ env.CWA_ONNXRUNTIME_COMMIT }}-${{ runner.os }}-${{ matrix.ort_arch }}-cpu-shared-private-v2
      - name: Check out pinned ONNX Runtime source
        id: checkout_onnxruntime
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os != 'Windows'
        uses: actions/checkout@v7
        with:
          repository: microsoft/onnxruntime
          ref: ${{ env.CWA_ONNXRUNTIME_COMMIT }}
          path: .dependencies/onnxruntime-source
          fetch-depth: 1
          submodules: recursive
      - name: Build pinned ONNX Runtime CPU library
        id: build_onnxruntime_posix
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        working-directory: ${{ env.CWA_ONNXRUNTIME_SOURCE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CWA_ONNXRUNTIME_COMMIT}"
          build_arguments=(
            --config Release
            --update
            --build
            --build_shared_lib
            --parallel 2
            --skip_tests
            --skip_submodule_sync
            --compile_no_warning_as_error
            --cmake_extra_defines
            onnxruntime_USE_TELEMETRY=OFF
            onnxruntime_BUILD_UNIT_TESTS=OFF
          )
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            build_arguments+=(
              --osx_arch "${{ matrix.ort_arch }}"
              --apple_deploy_target 14.0
            )
          fi
          ./build.sh "${build_arguments[@]}" 2>&1 | tee onnxruntime-build.log
      - name: Download pinned ONNX Runtime CPU distribution on Windows
        id: download_onnxruntime_windows
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP `
            "onnxruntime-win-x64-${env:CWA_ONNXRUNTIME_VERSION}.zip"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v${env:CWA_ONNXRUNTIME_VERSION}/onnxruntime-win-x64-${env:CWA_ONNXRUNTIME_VERSION}.zip"
          & curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) {
            throw "The pinned ONNX Runtime download failed with exit code $LASTEXITCODE."
          }
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "${env:CWA_ONNXRUNTIME_WINDOWS_SHA256}") {
            throw "The pinned ONNX Runtime archive checksum did not match."
          }
      - name: Normalize pinned ONNX Runtime distribution
        id: normalize_onnxruntime_posix
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          telemetry_caches=()
          while IFS= read -r cache_path; do
            telemetry_caches+=("${cache_path}")
          done < <(find "${CWA_ONNXRUNTIME_SOURCE}/build" -name CMakeCache.txt \
            -exec grep -lFx 'onnxruntime_USE_TELEMETRY:BOOL=OFF' {} +)
          test "${#telemetry_caches[@]}" -ge 1

          runtime_pattern='libonnxruntime.so.1.28.2'
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            runtime_pattern='libonnxruntime.1.28.2.dylib'
          fi
          runtime_files=()
          while IFS= read -r runtime_path; do
            runtime_files+=("${runtime_path}")
          done < <(find "${CWA_ONNXRUNTIME_SOURCE}/build" -type f \
            -name "${runtime_pattern}")
          if [[ "${#runtime_files[@]}" -ne 1 ]]; then
            echo "Expected one ${runtime_pattern}; found ${#runtime_files[@]}." >&2
            exit 1
          fi

          cmake -E make_directory \
            "${CWA_ONNXRUNTIME_ROOT}/include" \
            "${CWA_ONNXRUNTIME_ROOT}/lib"
          cmake -E copy_directory \
            "${CWA_ONNXRUNTIME_SOURCE}/include/onnxruntime/core/session" \
            "${CWA_ONNXRUNTIME_ROOT}/include"
          cmake -E copy "${runtime_files[0]}" \
            "${CWA_ONNXRUNTIME_ROOT}/lib/${runtime_pattern}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            cmake -E create_symlink "${runtime_pattern}" \
              "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.1.dylib"
          else
            cmake -E create_symlink "${runtime_pattern}" \
              "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.1"
          fi

          provider_files=()
          while IFS= read -r provider_path; do
            provider_files+=("${provider_path}")
          done < <(find "${CWA_ONNXRUNTIME_SOURCE}/build" -type f \
            \( -name 'libonnxruntime_providers_shared.so' \
               -o -name 'libonnxruntime_providers_shared.dylib' \))
          if [[ "${#provider_files[@]}" -gt 1 ]]; then
            echo "Expected at most one shared provider library; found ${#provider_files[@]}." >&2
            exit 1
          fi
          if [[ "${#provider_files[@]}" -eq 1 ]]; then
            cmake -E copy "${provider_files[0]}" \
              "${CWA_ONNXRUNTIME_ROOT}/lib/"
          fi
          cmake -E copy \
            "${CWA_ONNXRUNTIME_SOURCE}/LICENSE" \
            "${CWA_ONNXRUNTIME_SOURCE}/docs/Privacy.md" \
            "${CWA_ONNXRUNTIME_SOURCE}/ThirdPartyNotices.txt" \
            "${CWA_ONNXRUNTIME_SOURCE}/VERSION_NUMBER" \
            "${CWA_ONNXRUNTIME_ROOT}/"
          printf '%s\n' "${CWA_ONNXRUNTIME_COMMIT}" \
            > "${CWA_ONNXRUNTIME_ROOT}/GIT_COMMIT_ID"
          printf '%s\n' \
            "version=${CWA_ONNXRUNTIME_VERSION}" \
            "commit=${CWA_ONNXRUNTIME_COMMIT}" \
            "architecture=${{ matrix.ort_arch }}" \
            'onnxruntime_USE_TELEMETRY=OFF' \
            > "${CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE"
      - name: Normalize pinned ONNX Runtime distribution on Windows
        id: normalize_onnxruntime_windows
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP `
            "onnxruntime-win-x64-${env:CWA_ONNXRUNTIME_VERSION}.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP `
            "cwa-onnxruntime-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $distributionRoot = Join-Path $extractRoot `
            "onnxruntime-win-x64-${env:CWA_ONNXRUNTIME_VERSION}"
          New-Item -ItemType Directory -Force `
            "${env:CWA_ONNXRUNTIME_ROOT}/include", `
            "${env:CWA_ONNXRUNTIME_ROOT}/lib" | Out-Null
          Copy-Item `
            "$distributionRoot/include/*" `
            "${env:CWA_ONNXRUNTIME_ROOT}/include/" -Recurse
          Copy-Item "$distributionRoot/lib/onnxruntime.dll" `
            "${env:CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime.dll"
          Copy-Item "$distributionRoot/lib/onnxruntime.lib" `
            "${env:CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime.lib"
          if (Test-Path "$distributionRoot/lib/onnxruntime_providers_shared.dll") {
            Copy-Item "$distributionRoot/lib/onnxruntime_providers_shared.dll" `
              "${env:CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime_providers_shared.dll"
          }
          foreach ($metadataName in @(
            'LICENSE', 'Privacy.md', 'ThirdPartyNotices.txt', 'VERSION_NUMBER'
          )) {
            Copy-Item "$distributionRoot/$metadataName" `
              "${env:CWA_ONNXRUNTIME_ROOT}/$metadataName"
          }
          $archiveCommit = (Get-Content `
            "$distributionRoot/GIT_COMMIT_ID" -Raw).Trim()
          if ($archiveCommit -ne "${env:CWA_ONNXRUNTIME_COMMIT}") {
            throw 'The pinned ONNX Runtime archive commit did not match.'
          }
          Set-Content "${env:CWA_ONNXRUNTIME_ROOT}/GIT_COMMIT_ID" `
            -Value $archiveCommit -NoNewline
          @(
            "version=${env:CWA_ONNXRUNTIME_VERSION}"
            "commit=${env:CWA_ONNXRUNTIME_COMMIT}"
            "architecture=${{ matrix.ort_arch }}"
            'distribution=official-release'
            'telemetry=disabled-by-application'
          ) | Set-Content "${env:CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE"
      - name: Verify pinned ONNX Runtime provenance
        id: verify_onnxruntime
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < "${CWA_ONNXRUNTIME_ROOT}/VERSION_NUMBER")" \
            = "${CWA_ONNXRUNTIME_VERSION}"
          test "$(tr -d '\r\n' < "${CWA_ONNXRUNTIME_ROOT}/GIT_COMMIT_ID")" \
            = "${CWA_ONNXRUNTIME_COMMIT}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            tr -d '\r' < "${CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE" \
              | grep -Fx 'telemetry=disabled-by-application'
          else
            tr -d '\r' < "${CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE" \
              | grep -Fx 'onnxruntime_USE_TELEMETRY=OFF'
          fi
          tr -d '\r' < "${CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE" \
            | grep -Fx "architecture=${{ matrix.ort_arch }}"
          test -s "${CWA_ONNXRUNTIME_ROOT}/LICENSE"
          test -s "${CWA_ONNXRUNTIME_ROOT}/Privacy.md"
          test -s "${CWA_ONNXRUNTIME_ROOT}/ThirdPartyNotices.txt"
          test -s "${CWA_ONNXRUNTIME_ROOT}/include/onnxruntime_c_api.h"
          test -s "${CWA_ONNXRUNTIME_ROOT}/include/onnxruntime_cxx_api.h"
          case "${RUNNER_OS}" in
            Windows)
              test -s "${CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime.dll"
              test -s "${CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime.lib"
              ;;
            macOS)
              test -s "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.${CWA_ONNXRUNTIME_VERSION}.dylib"
              test -L "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.1.dylib"
              test "$(readlink "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.1.dylib")" \
                = "libonnxruntime.${CWA_ONNXRUNTIME_VERSION}.dylib"
              test "$(lipo -archs "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.${CWA_ONNXRUNTIME_VERSION}.dylib")" \
                = "${{ matrix.ort_arch }}"
              ;;
            Linux)
              test -s "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.${CWA_ONNXRUNTIME_VERSION}"
              test -L "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.1"
              test "$(readlink "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.1")" \
                = "libonnxruntime.so.${CWA_ONNXRUNTIME_VERSION}"
              file "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.${CWA_ONNXRUNTIME_VERSION}" \
                | grep -F 'x86-64'
              ;;
          esac
      - name: Install Qt
        id: install_qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          arch: ${{ matrix.qt-arch }}
          modules: qtserialport qtmultimedia qtwebsockets qttasktree
          cache: true
          aqtsource: ${{ matrix.aqt_source }}
      - name: Retry Qt installation from a clean uncached directory
        id: install_qt_retry
        if: steps.install_qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          dir: ${{ runner.temp }}/Qt-retry
          version: "6.11.2"
          arch: ${{ matrix.qt-arch }}
          modules: qtserialport qtmultimedia qtwebsockets qttasktree
          cache: false
          aqtsource: ${{ matrix.aqt_source }}
          aqtversion: ==3.3.0
          py7zrversion: ==1.0.0
          extra: --external 7z
      - name: Configure desktop
        id: configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCWA_BUILD_APP=OFF
          -DCWA_BUILD_DESKTOP=ON
          -DCWA_BUILD_TESTS=ON
          -DCWA_ENABLE_ONNX_CHARACTER_DECODER=ON
          -DCWA_ONNXRUNTIME_ROOT="${{ env.CWA_ONNXRUNTIME_ROOT }}"
          -DCWA_PACKAGE_REVISION=${{ github.run_number }}
          ${{ matrix.configure-arguments }}
      - name: Build desktop and core tests
        id: build
        shell: bash
        run: cmake --build build --config Release --parallel 2>&1 | tee build-output.log
      - name: Run dependency-free tests
        id: test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test-output.log
      - name: Stage self-contained application
        id: install
        run: cmake --install build --config Release --prefix stage
      - name: Verify staged platform layout
        id: verify_stage
        shell: bash
        run: |
          set -euo pipefail
          test -s build/cw-assistant-version.txt
          build_version="$(tr -d '\r\n' < build/cw-assistant-version.txt)"
          echo "Expected canonical version: ${build_version}"
          ort_license_dir=stage/share/doc/cw-assistant/third-party/onnxruntime
          test -s "${ort_license_dir}/LICENSE"
          test -s "${ort_license_dir}/Privacy.md"
          test -s "${ort_license_dir}/ThirdPartyNotices.txt"
          cmp "${CWA_ONNXRUNTIME_ROOT}/LICENSE" "${ort_license_dir}/LICENSE"
          cmp "${CWA_ONNXRUNTIME_ROOT}/Privacy.md" "${ort_license_dir}/Privacy.md"
          cmp "${CWA_ONNXRUNTIME_ROOT}/ThirdPartyNotices.txt" \
            "${ort_license_dir}/ThirdPartyNotices.txt"
          case "${RUNNER_OS}" in
            Windows)
              installed_version_file=stage/share/doc/cw-assistant/VERSION
              test -s "${installed_version_file}"
              cmp build/cw-assistant-version.txt "${installed_version_file}"
              test -f stage/bin/cw-assistant-desktop.exe
              test -f stage/bin/onnxruntime.dll
              executable_version="$(powershell.exe -NoProfile -Command \
                "(Get-Item 'stage/bin/cw-assistant-desktop.exe').VersionInfo.ProductVersion" \
                | tr -d '\r\n')"
              echo "Windows executable ProductVersion: ${executable_version}"
              test "${executable_version}" = "${build_version}"
              ;;
            macOS)
              app_binary=stage/cw-assistant-desktop.app/Contents/MacOS/cw-assistant-desktop
              installed_version_file=stage/cw-assistant-desktop.app/Contents/Resources/VERSION
              test -s "${installed_version_file}"
              cmp build/cw-assistant-version.txt "${installed_version_file}"
              test -x "${app_binary}"
              test -f stage/cw-assistant-desktop.app/Contents/Frameworks/libonnxruntime.1.dylib
              otool -L "${app_binary}" | grep -F '@rpath/libonnxruntime.1.dylib'
              xcrun vtool -show-build "${app_binary}" | grep -Eq 'minos +14\.0'
              cmake \
                -DCWA_APP_BUNDLE="$PWD/stage/cw-assistant-desktop.app" \
                -DCWA_EXPECTED_VERSION="${build_version}" \
                -P cmake/VerifyMacOSBundle.cmake
              ;;
            Linux)
              installed_version_file=stage/share/doc/cw-assistant/VERSION
              test -s "${installed_version_file}"
              cmp build/cw-assistant-version.txt "${installed_version_file}"
              test -x stage/bin/cw-assistant-desktop
              test -f stage/lib/cw-assistant/libonnxruntime.so.1
              readelf -d stage/bin/cw-assistant-desktop | grep -F 'libonnxruntime.so.1'
              ;;
          esac
      - name: Smoke-test staged application with native graphics
        id: smoke_stage
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Windows)
              stage/bin/cw-assistant-desktop.exe --profile ci-native-smoke --smoke-test
              ;;
            macOS)
              stage/cw-assistant-desktop.app/Contents/MacOS/cw-assistant-desktop --profile ci-native-smoke --smoke-test
              ;;
            Linux)
              xvfb-run -a stage/bin/cw-assistant-desktop --profile ci-native-smoke --smoke-test
              ;;
          esac
      - name: Preserve the staged application as an archive
        id: archive
        if: matrix.portable_archive
        run: cmake -E tar czf ${{ matrix.artifact }}.tar.gz --format=gnutar stage
      - name: Publish downloadable build
        id: upload
        if: matrix.portable_archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build upgrade-capable Windows installer
        id: build_windows_installer
        if: matrix.windows_installer
        shell: bash
        run: cpack --config build/CPackConfig.cmake -G WIX -B packages 2>&1 | tee cpack-wix.log
      - name: Verify Windows installer finish-page launch behavior
        id: verify_windows_installer
        if: matrix.windows_installer
        shell: pwsh
        run: |
          try {
            & ./src/desktop/packaging/windows/VerifyWindowsInstaller.ps1 `
              -PackageDirectory packages 2>&1 |
                Tee-Object -FilePath windows-installer-verification.log
          }
          catch {
            $_ | Out-String |
              Tee-Object -FilePath windows-installer-verification.log -Append
            throw
          }
      - name: Publish Windows installer
        id: upload_windows_installer
        if: matrix.windows_installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Build Debian/Ubuntu package
        id: build_deb
        if: matrix.debian_package
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B packages
          build_version="$(tr -d '\r\n' < build/cw-assistant-version.txt)"
          deb_packages=(packages/*.deb)
          test "${#deb_packages[@]}" -eq 1
          test "$(dpkg-deb -f "${deb_packages[0]}" Version)" = "${build_version}-1"
          cmake -E copy build/cw-assistant-version.txt packages/cw-assistant-version.txt
      - name: Publish Debian/Ubuntu package
        id: upload_deb
        if: matrix.debian_package
        uses: actions/upload-artifact@v7
        with:
          name: cw-assistant-debian-ubuntu-x64
          path: |
            packages/*.deb
            packages/cw-assistant-version.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish SSH-queryable job result
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CWA_MARKER: ${{ matrix.marker }}
          CWA_QT_RESULT: ${{ steps.install_qt.outcome }}
          CWA_QT_RETRY_RESULT: ${{ steps.install_qt_retry.outcome }}
          CWA_ORT_CACHE_RESULT: ${{ steps.cache_onnxruntime.outcome }}
          CWA_ORT_CHECKOUT_RESULT: ${{ steps.checkout_onnxruntime.outcome }}
          CWA_ORT_BUILD_POSIX_RESULT: ${{ steps.build_onnxruntime_posix.outcome }}
          CWA_ORT_DOWNLOAD_WINDOWS_RESULT: ${{ steps.download_onnxruntime_windows.outcome }}
          CWA_ORT_NORMALIZE_POSIX_RESULT: ${{ steps.normalize_onnxruntime_posix.outcome }}
          CWA_ORT_NORMALIZE_WINDOWS_RESULT: ${{ steps.normalize_onnxruntime_windows.outcome }}
          CWA_ORT_VERIFY_RESULT: ${{ steps.verify_onnxruntime.outcome }}
          CWA_CONFIGURE_RESULT: ${{ steps.configure.outcome }}
          CWA_BUILD_RESULT: ${{ steps.build.outcome }}
          CWA_TEST_RESULT: ${{ steps.test.outcome }}
          CWA_INSTALL_RESULT: ${{ steps.install.outcome }}
          CWA_VERIFY_STAGE_RESULT: ${{ steps.verify_stage.outcome }}
          CWA_STAGE_SMOKE_RESULT: ${{ steps.smoke_stage.outcome }}
          CWA_ARCHIVE_RESULT: ${{ steps.archive.outcome }}
          CWA_UPLOAD_RESULT: ${{ steps.upload.outcome }}
          CWA_WINDOWS_INSTALLER_RESULT: ${{ steps.build_windows_installer.outcome }}
          CWA_WINDOWS_VERIFY_RESULT: ${{ steps.verify_windows_installer.outcome }}
          CWA_WINDOWS_UPLOAD_RESULT: ${{ steps.upload_windows_installer.outcome }}
          CWA_DEB_RESULT: ${{ steps.build_deb.outcome }}
          CWA_DEB_UPLOAD_RESULT: ${{ steps.upload_deb.outcome }}
        run: |
          status_tag="ci-status/${CWA_MARKER}-${GITHUB_SHA}"
          status_message="ort_cache=${CWA_ORT_CACHE_RESULT} ort_checkout=${CWA_ORT_CHECKOUT_RESULT} ort_build_posix=${CWA_ORT_BUILD_POSIX_RESULT} ort_download_windows=${CWA_ORT_DOWNLOAD_WINDOWS_RESULT} ort_normalize_posix=${CWA_ORT_NORMALIZE_POSIX_RESULT} ort_normalize_windows=${CWA_ORT_NORMALIZE_WINDOWS_RESULT} ort_verify=${CWA_ORT_VERIFY_RESULT} qt=${CWA_QT_RESULT} qt_retry=${CWA_QT_RETRY_RESULT} configure=${CWA_CONFIGURE_RESULT} build=${CWA_BUILD_RESULT} test=${CWA_TEST_RESULT} install=${CWA_INSTALL_RESULT} verify_stage=${CWA_VERIFY_STAGE_RESULT} stage_smoke=${CWA_STAGE_SMOKE_RESULT} archive=${CWA_ARCHIVE_RESULT} upload=${CWA_UPLOAD_RESULT} win_installer=${CWA_WINDOWS_INSTALLER_RESULT} win_verify=${CWA_WINDOWS_VERIFY_RESULT} win_upload=${CWA_WINDOWS_UPLOAD_RESULT} deb=${CWA_DEB_RESULT} deb_upload=${CWA_DEB_UPLOAD_RESULT}"
          if [[ "${CWA_ORT_BUILD_POSIX_RESULT}" == "failure" ]]; then
            ort_log="$(tail -n 30 "${CWA_ONNXRUNTIME_SOURCE}/onnxruntime-build.log" 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${ort_log}" ]]; then
              status_message="${status_message}"$'\n'"ort_log=${ort_log}"
            fi
          fi
          if [[ "${CWA_QT_RESULT}" == "failure" ]]; then
            qt_log="$(find "${GITHUB_WORKSPACE}" -type f -name aqtinstall.log -exec tail -n 20 {} \; 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${qt_log}" ]]; then
              status_message="${status_message}"$'\n'"qt_log=${qt_log}"
            fi
          fi
          if [[ "${CWA_WINDOWS_INSTALLER_RESULT}" == "failure" ]]; then
            wix_log="$(tail -n 30 cpack-wix.log 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${wix_log}" ]]; then
              status_message="${status_message}"$'\n'"wix_log=${wix_log}"
            fi
          fi
          if [[ "${CWA_WINDOWS_VERIFY_RESULT}" == "failure" ]]; then
            verify_log="$(tail -n 30 windows-installer-verification.log 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${verify_log}" ]]; then
              status_message="${status_message}"$'\n'"win_verify_log=${verify_log}"
            fi
          fi
          if [[ "${CWA_BUILD_RESULT}" == "failure" ]]; then
            build_log="$(tail -n 35 build-output.log 2>/dev/null | tr '\r\n' '  ' | tail -c 3000)"
            if [[ -n "${build_log}" ]]; then
              status_message="${status_message}"$'\n'"build_log=${build_log}"
            fi
          fi
          if [[ "${CWA_TEST_RESULT}" == "failure" ]]; then
            test_log="$(tail -n 45 test-output.log 2>/dev/null | tr '\r\n' '  ' | tail -c 4000)"
            if [[ -n "${test_log}" ]]; then
              status_message="${status_message}"$'\n'"test_log=${test_log}"
            fi
          fi
          git config user.name "CW Assistant CI"
          git config user.email "ci@cw-assistant.invalid"
          git tag --force --annotate "${status_tag}" --message "${status_message}"
          git push origin "refs/tags/${status_tag}" --force

  publish-continuous-release:
    name: Publish continuous binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-desktop
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out binary index
        uses: actions/checkout@v7
      - name: Download every successful platform package
        id: download
        uses: actions/download-artifact@v8
        with:
          pattern: cw-assistant-*
          path: release-assets
          merge-multiple: true
      - name: Normalize names and generate integrity metadata
        id: normalize
        shell: bash
        run: |
          shopt -s nullglob
          deb_packages=(release-assets/*.deb)
          if (( ${#deb_packages[@]} != 1 )); then
            echo "Expected exactly one Debian package; found ${#deb_packages[@]}." >&2
            exit 1
          fi
          mv "${deb_packages[0]}" release-assets/cw-assistant-debian-ubuntu-x64.deb
          windows_installers=(release-assets/*.msi)
          if (( ${#windows_installers[@]} != 1 )); then
            echo "Expected exactly one Windows installer; found ${#windows_installers[@]}." >&2
            exit 1
          fi
          mv "${windows_installers[0]}" release-assets/cw-assistant-windows11-x64.msi
          if [[ ! -f release-assets/cw-assistant-version.txt ]]; then
            echo "The canonical build-version file is missing." >&2
            exit 1
          fi
          build_version="$(tr -d '\r\n' < release-assets/cw-assistant-version.txt)"
          if [[ ! "${build_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid canonical build version: ${build_version}" >&2
            exit 1
          fi
          jq --arg version "${build_version}" \
            '.version = $version' binaries/latest.json \
            > release-assets/latest.json
          rm release-assets/cw-assistant-version.txt
          (
            cd release-assets
            sha256sum cw-assistant-* | sort -k2 > SHA256SUMS
          )
      - name: Write continuous-release notes
        id: notes
        shell: bash
        run: |
          {
            echo "Automated, unsigned development builds from commit ${GITHUB_SHA}."
            echo
            echo "Every platform build and the core tests passed before these assets were published."
            echo "Use SHA256SUMS to verify the downloaded payload."
          } > continuous-release-notes.md
      - name: Create or update continuous prerelease
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view continuous >/dev/null 2>&1; then
            payloads=()
            for asset in release-assets/*; do
              if [[ "$(basename "${asset}")" != "latest.json" ]]; then
                payloads+=("${asset}")
              fi
            done
            gh release upload continuous "${payloads[@]}" --clobber
            # Keep the previous manifest reachable while large platform
            # artifacts are replaced. The new manifest becomes the final,
            # pointer to the completed release set.
            gh release upload continuous release-assets/latest.json --clobber
            gh release edit continuous \
              --title "Continuous development builds" \
              --notes-file continuous-release-notes.md \
              --prerelease \
              --latest=false
          else
            gh release create continuous release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "Continuous development builds" \
              --notes-file continuous-release-notes.md \
              --prerelease \
              --latest=false
          fi
      - name: Publish release failure result
        if: failure()
        shell: bash
        env:
          CWA_DOWNLOAD_RESULT: ${{ steps.download.outcome }}
          CWA_NORMALIZE_RESULT: ${{ steps.normalize.outcome }}
          CWA_NOTES_RESULT: ${{ steps.notes.outcome }}
          CWA_RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          status_tag="ci-status/release-${GITHUB_SHA}"
          status_message="download=${CWA_DOWNLOAD_RESULT} normalize=${CWA_NORMALIZE_RESULT} notes=${CWA_NOTES_RESULT} release=${CWA_RELEASE_RESULT}"
          git config user.name "CW Assistant CI"
          git config user.email "ci@cw-assistant.invalid"
          git tag --force --annotate "${status_tag}" --message "${status_message}"
          git push origin "refs/tags/${status_tag}" --force
      - name: Mark the fully verified commit
        shell: bash
        run: |
          git tag --force continuous "${GITHUB_SHA}"
          git push origin refs/tags/continuous --force
          for marker in windows11-x64 linux-x64 macos-arm64 macos-x64 release; do
            git push origin --delete "refs/tags/ci-status/${marker}-${GITHUB_SHA}" 2>/dev/null || true
          done

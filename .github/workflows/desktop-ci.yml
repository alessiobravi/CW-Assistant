name: Cross-platform Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 x64 / MSVC
            os: windows-2025
            qt-arch: win64_msvc2022_64
            configure-arguments: -A x64
            artifact: cw-buddy-windows11-x64
            marker: windows11-x64
            # Build-tool pin only: remove after a released aqtinstall includes
            # the Qt 6.11 Windows repository-layout fix from this commit.
            aqt_source: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
            portable_archive: false
            windows_installer: true
            debian_package: false
            sdr_configure_arguments: ""
            ort_arch: x64
          - name: Linux x64 / GCC
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
            configure-arguments: ""
            artifact: cw-buddy-linux-x64
            marker: linux-x64
            aqt_source: ""
            portable_archive: true
            windows_installer: false
            debian_package: true
            sdr_configure_arguments: -DCWA_ENABLE_SOAPY_SDR=ON
            ort_arch: x64
          - name: macOS ARM64 / Apple Clang
            os: macos-15
            qt-arch: clang_64
            configure-arguments: -DCMAKE_OSX_ARCHITECTURES=arm64
            artifact: cw-buddy-macos-arm64
            marker: macos-arm64
            aqt_source: ""
            portable_archive: true
            windows_installer: false
            debian_package: false
            sdr_configure_arguments: ""
            ort_arch: arm64
          - name: macOS x64 / Apple Clang
            os: macos-15-intel
            qt-arch: clang_64
            configure-arguments: -DCMAKE_OSX_ARCHITECTURES=x86_64
            artifact: cw-buddy-macos-x64
            marker: macos-x64
            aqt_source: ""
            portable_archive: true
            windows_installer: false
            debian_package: false
            sdr_configure_arguments: ""
            ort_arch: x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CWA_ONNXRUNTIME_VERSION: 1.28.2
      CWA_ONNXRUNTIME_COMMIT: 33ca9628233dc8f002435e868d4c2e9f82766ca1
      CWA_ONNXRUNTIME_WINDOWS_SHA256: c4eedd29489d5feca21866d054638416f3655bf6b18851b3b6b85c8313e95c35
      CWA_ONNXRUNTIME_ROOT: ${{ github.workspace }}/.dependencies/onnxruntime-root
      CWA_ONNXRUNTIME_SOURCE: ${{ github.workspace }}/.dependencies/onnxruntime-source
      CWA_SOAPYSDR_COMMIT: 1cf5a539a21414ff509ff7d0eedfc5fa8edb90c6
      CWA_SOAPYRTLSDR_COMMIT: 80c93fbe189def3ab68d47a6ad3f813f96d3cb99
      CWA_VCPKG_COMMIT: f781d9387e4684783e69e136e2e124ff4660bffc
      CWA_SOAPYSDR_ROOT: ${{ github.workspace }}/.dependencies/soapysdr-root
      CWA_SOAPYSDR_SOURCE: ${{ github.workspace }}/.dependencies/soapysdr-source
      CWA_SOAPYRTLSDR_SOURCE: ${{ github.workspace }}/.dependencies/soapyrtlsdr-source
      CWA_VCPKG_SOURCE: ${{ github.workspace }}/.dependencies/vcpkg-source
      CWA_VCPKG_INSTALLED: ${{ github.workspace }}/.dependencies/vcpkg-installed
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Restore pinned Windows SoapySDR and RTL-SDR runtime
        id: cache_windows_sdr
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ env.CWA_SOAPYSDR_ROOT }}
          key: cwa-windows-sdr-${{ env.CWA_SOAPYSDR_COMMIT }}-${{ env.CWA_SOAPYRTLSDR_COMMIT }}-${{ env.CWA_VCPKG_COMMIT }}-x64-v1
      - name: Check out pinned SoapySDR source
        if: runner.os == 'Windows' && steps.cache_windows_sdr.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: pothosware/SoapySDR
          ref: ${{ env.CWA_SOAPYSDR_COMMIT }}
          path: .dependencies/soapysdr-source
          fetch-depth: 1
      - name: Check out pinned SoapyRTLSDR source
        if: runner.os == 'Windows' && steps.cache_windows_sdr.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: pothosware/SoapyRTLSDR
          ref: ${{ env.CWA_SOAPYRTLSDR_COMMIT }}
          path: .dependencies/soapyrtlsdr-source
          fetch-depth: 1
      - name: Check out pinned vcpkg registry
        if: runner.os == 'Windows' && steps.cache_windows_sdr.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.CWA_VCPKG_COMMIT }}
          path: .dependencies/vcpkg-source
          fetch-depth: 1
      - name: Build pinned Windows SoapySDR and RTL-SDR runtime
        id: build_windows_sdr
        if: runner.os == 'Windows' && steps.cache_windows_sdr.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path windows-sdr-build.log -Force
          function Invoke-Checked {
            param(
              [Parameter(Mandatory = $true)][string]$Executable,
              [Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments
            )
            & $Executable @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Native command failed with exit code ${LASTEXITCODE}: $Executable $($Arguments -join ' ')"
            }
          }

          if ((git -C $env:CWA_SOAPYSDR_SOURCE rev-parse HEAD) -ne $env:CWA_SOAPYSDR_COMMIT) {
            throw 'The SoapySDR source pin did not match.'
          }
          if ((git -C $env:CWA_SOAPYRTLSDR_SOURCE rev-parse HEAD) -ne $env:CWA_SOAPYRTLSDR_COMMIT) {
            throw 'The SoapyRTLSDR source pin did not match.'
          }
          if ((git -C $env:CWA_VCPKG_SOURCE rev-parse HEAD) -ne $env:CWA_VCPKG_COMMIT) {
            throw 'The vcpkg registry pin did not match.'
          }

          Invoke-Checked "$env:CWA_VCPKG_SOURCE/bootstrap-vcpkg.bat" '-disableMetrics'
          Invoke-Checked "$env:CWA_VCPKG_SOURCE/vcpkg.exe" 'install' 'rtlsdr:x64-windows' `
            "--x-install-root=$env:CWA_VCPKG_INSTALLED" '--clean-after-build'

          Invoke-Checked 'cmake' '-S' $env:CWA_SOAPYSDR_SOURCE '-B' '.dependencies/soapysdr-build' `
            '-A' 'x64' '-DENABLE_APPS=OFF' '-DENABLE_TESTS=OFF' `
            '-DENABLE_PYTHON=OFF' '-DENABLE_PYTHON3=OFF' `
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' `
            "-DCMAKE_INSTALL_PREFIX=$env:CWA_SOAPYSDR_ROOT"
          Invoke-Checked 'cmake' '--build' '.dependencies/soapysdr-build' `
            '--config' 'Release' '--target' 'install' '--parallel' '2'

          $tripletRoot = Join-Path $env:CWA_VCPKG_INSTALLED 'x64-windows'
          Invoke-Checked 'cmake' '-S' $env:CWA_SOAPYRTLSDR_SOURCE `
            '-B' '.dependencies/soapyrtlsdr-build' '-A' 'x64' `
            "-DSoapySDR_DIR=$env:CWA_SOAPYSDR_ROOT/cmake" `
            '-DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE' `
            "-DRTLSDR_INCLUDE_DIR=$tripletRoot/include" `
            "-DRTLSDR_LIBRARY=$tripletRoot/lib/rtlsdr.lib" `
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' `
            "-DCMAKE_INSTALL_PREFIX=$env:CWA_SOAPYSDR_ROOT"
          Invoke-Checked 'cmake' '--build' '.dependencies/soapyrtlsdr-build' `
            '--config' 'Release' '--target' 'install' '--parallel' '2'

          Copy-Item "$tripletRoot/bin/*.dll" "$env:CWA_SOAPYSDR_ROOT/bin/"
          foreach ($license in @(
            @('soapysdr', "$env:CWA_SOAPYSDR_SOURCE/LICENSE_1_0.txt", 'LICENSE_1_0.txt'),
            @('soapyrtlsdr', "$env:CWA_SOAPYRTLSDR_SOURCE/LICENSE.txt", 'LICENSE.txt'),
            @('rtlsdr', "$tripletRoot/share/rtlsdr/copyright", 'copyright'),
            @('libusb', "$tripletRoot/share/libusb/copyright", 'copyright'),
            @('pthreads', "$tripletRoot/share/pthreads/copyright", 'copyright')
          )) {
            $destination = Join-Path "$env:CWA_SOAPYSDR_ROOT/share/licenses" $license[0]
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item $license[1] (Join-Path $destination $license[2])
          }
          @(
            "soapysdr_commit=$env:CWA_SOAPYSDR_COMMIT"
            "soapyrtlsdr_commit=$env:CWA_SOAPYRTLSDR_COMMIT"
            "vcpkg_commit=$env:CWA_VCPKG_COMMIT"
            'architecture=x64'
            'direction=RX-only'
          ) | Set-Content "$env:CWA_SOAPYSDR_ROOT/BUILD_PROVENANCE"
          Stop-Transcript
      - name: Verify pinned Windows SoapySDR runtime
        id: verify_windows_sdr
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($relative in @(
            'bin/SoapySDR.dll',
            'bin/rtlsdr.dll',
            'bin/libusb-1.0.dll',
            'bin/pthreadVC3.dll',
            'cmake/SoapySDRConfig.cmake',
            'lib/SoapySDR/modules0.8/rtlsdrSupport.dll',
            'share/licenses/soapysdr/LICENSE_1_0.txt',
            'share/licenses/soapyrtlsdr/LICENSE.txt',
            'share/licenses/rtlsdr/copyright',
            'share/licenses/libusb/copyright',
            'share/licenses/pthreads/copyright',
            'BUILD_PROVENANCE'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:CWA_SOAPYSDR_ROOT $relative) -PathType Leaf)) {
              throw "Prepared Windows SDR runtime is missing $relative"
            }
          }
          $provenance = Get-Content "$env:CWA_SOAPYSDR_ROOT/BUILD_PROVENANCE"
          foreach ($line in @(
            "soapysdr_commit=$env:CWA_SOAPYSDR_COMMIT",
            "soapyrtlsdr_commit=$env:CWA_SOAPYRTLSDR_COMMIT",
            "vcpkg_commit=$env:CWA_VCPKG_COMMIT",
            'architecture=x64',
            'direction=RX-only'
          )) {
            if ($provenance -notcontains $line) {
              throw "Prepared Windows SDR provenance is missing: $line"
            }
          }
      - name: Install Linux SDR build and RTL-SDR runtime
        id: install_linux_sdr
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libsoapysdr-dev soapysdr-module-rtlsdr
      - name: Restore pinned ONNX Runtime CPU build
        id: cache_onnxruntime
        uses: actions/cache@v5
        with:
          path: ${{ env.CWA_ONNXRUNTIME_ROOT }}
          key: cwa-onnxruntime-${{ env.CWA_ONNXRUNTIME_VERSION }}-${{ env.CWA_ONNXRUNTIME_COMMIT }}-${{ runner.os }}-${{ matrix.ort_arch }}-cpu-shared-private-v2
      - name: Check out pinned ONNX Runtime source
        id: checkout_onnxruntime
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os != 'Windows'
        uses: actions/checkout@v7
        with:
          repository: microsoft/onnxruntime
          ref: ${{ env.CWA_ONNXRUNTIME_COMMIT }}
          path: .dependencies/onnxruntime-source
          fetch-depth: 1
          submodules: recursive
      - name: Build pinned ONNX Runtime CPU library
        id: build_onnxruntime_posix
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        working-directory: ${{ env.CWA_ONNXRUNTIME_SOURCE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CWA_ONNXRUNTIME_COMMIT}"
          build_arguments=(
            --config Release
            --update
            --build
            --build_shared_lib
            --parallel 2
            --skip_tests
            --skip_submodule_sync
            --compile_no_warning_as_error
            --cmake_extra_defines
            onnxruntime_USE_TELEMETRY=OFF
            onnxruntime_BUILD_UNIT_TESTS=OFF
          )
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            build_arguments+=(
              --osx_arch "${{ matrix.ort_arch }}"
              --apple_deploy_target 14.0
            )
          fi
          ./build.sh "${build_arguments[@]}" 2>&1 | tee onnxruntime-build.log
      - name: Download pinned ONNX Runtime CPU distribution on Windows
        id: download_onnxruntime_windows
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP `
            "onnxruntime-win-x64-${env:CWA_ONNXRUNTIME_VERSION}.zip"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v${env:CWA_ONNXRUNTIME_VERSION}/onnxruntime-win-x64-${env:CWA_ONNXRUNTIME_VERSION}.zip"
          & curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) {
            throw "The pinned ONNX Runtime download failed with exit code $LASTEXITCODE."
          }
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "${env:CWA_ONNXRUNTIME_WINDOWS_SHA256}") {
            throw "The pinned ONNX Runtime archive checksum did not match."
          }
      - name: Normalize pinned ONNX Runtime distribution
        id: normalize_onnxruntime_posix
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          telemetry_caches=()
          while IFS= read -r cache_path; do
            telemetry_caches+=("${cache_path}")
          done < <(find "${CWA_ONNXRUNTIME_SOURCE}/build" -name CMakeCache.txt \
            -exec grep -lFx 'onnxruntime_USE_TELEMETRY:BOOL=OFF' {} +)
          test "${#telemetry_caches[@]}" -ge 1

          runtime_pattern='libonnxruntime.so.1.28.2'
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            runtime_pattern='libonnxruntime.1.28.2.dylib'
          fi
          runtime_files=()
          while IFS= read -r runtime_path; do
            runtime_files+=("${runtime_path}")
          done < <(find "${CWA_ONNXRUNTIME_SOURCE}/build" -type f \
            -name "${runtime_pattern}")
          if [[ "${#runtime_files[@]}" -ne 1 ]]; then
            echo "Expected one ${runtime_pattern}; found ${#runtime_files[@]}." >&2
            exit 1
          fi

          cmake -E make_directory \
            "${CWA_ONNXRUNTIME_ROOT}/include" \
            "${CWA_ONNXRUNTIME_ROOT}/lib"
          cmake -E copy_directory \
            "${CWA_ONNXRUNTIME_SOURCE}/include/onnxruntime/core/session" \
            "${CWA_ONNXRUNTIME_ROOT}/include"
          cmake -E copy "${runtime_files[0]}" \
            "${CWA_ONNXRUNTIME_ROOT}/lib/${runtime_pattern}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            cmake -E create_symlink "${runtime_pattern}" \
              "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.1.dylib"
          else
            cmake -E create_symlink "${runtime_pattern}" \
              "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.1"
          fi

          provider_files=()
          while IFS= read -r provider_path; do
            provider_files+=("${provider_path}")
          done < <(find "${CWA_ONNXRUNTIME_SOURCE}/build" -type f \
            \( -name 'libonnxruntime_providers_shared.so' \
               -o -name 'libonnxruntime_providers_shared.dylib' \))
          if [[ "${#provider_files[@]}" -gt 1 ]]; then
            echo "Expected at most one shared provider library; found ${#provider_files[@]}." >&2
            exit 1
          fi
          if [[ "${#provider_files[@]}" -eq 1 ]]; then
            cmake -E copy "${provider_files[0]}" \
              "${CWA_ONNXRUNTIME_ROOT}/lib/"
          fi
          cmake -E copy \
            "${CWA_ONNXRUNTIME_SOURCE}/LICENSE" \
            "${CWA_ONNXRUNTIME_SOURCE}/docs/Privacy.md" \
            "${CWA_ONNXRUNTIME_SOURCE}/ThirdPartyNotices.txt" \
            "${CWA_ONNXRUNTIME_SOURCE}/VERSION_NUMBER" \
            "${CWA_ONNXRUNTIME_ROOT}/"
          printf '%s\n' "${CWA_ONNXRUNTIME_COMMIT}" \
            > "${CWA_ONNXRUNTIME_ROOT}/GIT_COMMIT_ID"
          printf '%s\n' \
            "version=${CWA_ONNXRUNTIME_VERSION}" \
            "commit=${CWA_ONNXRUNTIME_COMMIT}" \
            "architecture=${{ matrix.ort_arch }}" \
            'onnxruntime_USE_TELEMETRY=OFF' \
            > "${CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE"
      - name: Normalize pinned ONNX Runtime distribution on Windows
        id: normalize_onnxruntime_windows
        if: steps.cache_onnxruntime.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP `
            "onnxruntime-win-x64-${env:CWA_ONNXRUNTIME_VERSION}.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP `
            "cwa-onnxruntime-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $distributionRoot = Join-Path $extractRoot `
            "onnxruntime-win-x64-${env:CWA_ONNXRUNTIME_VERSION}"
          New-Item -ItemType Directory -Force `
            "${env:CWA_ONNXRUNTIME_ROOT}/include", `
            "${env:CWA_ONNXRUNTIME_ROOT}/lib" | Out-Null
          Copy-Item `
            "$distributionRoot/include/*" `
            "${env:CWA_ONNXRUNTIME_ROOT}/include/" -Recurse
          Copy-Item "$distributionRoot/lib/onnxruntime.dll" `
            "${env:CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime.dll"
          Copy-Item "$distributionRoot/lib/onnxruntime.lib" `
            "${env:CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime.lib"
          if (Test-Path "$distributionRoot/lib/onnxruntime_providers_shared.dll") {
            Copy-Item "$distributionRoot/lib/onnxruntime_providers_shared.dll" `
              "${env:CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime_providers_shared.dll"
          }
          foreach ($metadataName in @(
            'LICENSE', 'Privacy.md', 'ThirdPartyNotices.txt', 'VERSION_NUMBER'
          )) {
            Copy-Item "$distributionRoot/$metadataName" `
              "${env:CWA_ONNXRUNTIME_ROOT}/$metadataName"
          }
          $archiveCommit = (Get-Content `
            "$distributionRoot/GIT_COMMIT_ID" -Raw).Trim()
          if ($archiveCommit -ne "${env:CWA_ONNXRUNTIME_COMMIT}") {
            throw 'The pinned ONNX Runtime archive commit did not match.'
          }
          Set-Content "${env:CWA_ONNXRUNTIME_ROOT}/GIT_COMMIT_ID" `
            -Value $archiveCommit -NoNewline
          @(
            "version=${env:CWA_ONNXRUNTIME_VERSION}"
            "commit=${env:CWA_ONNXRUNTIME_COMMIT}"
            "architecture=${{ matrix.ort_arch }}"
            'distribution=official-release'
            'telemetry=disabled-by-application'
          ) | Set-Content "${env:CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE"
      - name: Verify pinned ONNX Runtime provenance
        id: verify_onnxruntime
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < "${CWA_ONNXRUNTIME_ROOT}/VERSION_NUMBER")" \
            = "${CWA_ONNXRUNTIME_VERSION}"
          test "$(tr -d '\r\n' < "${CWA_ONNXRUNTIME_ROOT}/GIT_COMMIT_ID")" \
            = "${CWA_ONNXRUNTIME_COMMIT}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            tr -d '\r' < "${CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE" \
              | grep -Fx 'telemetry=disabled-by-application'
          else
            tr -d '\r' < "${CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE" \
              | grep -Fx 'onnxruntime_USE_TELEMETRY=OFF'
          fi
          tr -d '\r' < "${CWA_ONNXRUNTIME_ROOT}/BUILD_PROVENANCE" \
            | grep -Fx "architecture=${{ matrix.ort_arch }}"
          test -s "${CWA_ONNXRUNTIME_ROOT}/LICENSE"
          test -s "${CWA_ONNXRUNTIME_ROOT}/Privacy.md"
          test -s "${CWA_ONNXRUNTIME_ROOT}/ThirdPartyNotices.txt"
          test -s "${CWA_ONNXRUNTIME_ROOT}/include/onnxruntime_c_api.h"
          test -s "${CWA_ONNXRUNTIME_ROOT}/include/onnxruntime_cxx_api.h"
          case "${RUNNER_OS}" in
            Windows)
              test -s "${CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime.dll"
              test -s "${CWA_ONNXRUNTIME_ROOT}/lib/onnxruntime.lib"
              ;;
            macOS)
              test -s "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.${CWA_ONNXRUNTIME_VERSION}.dylib"
              test -L "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.1.dylib"
              test "$(readlink "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.1.dylib")" \
                = "libonnxruntime.${CWA_ONNXRUNTIME_VERSION}.dylib"
              test "$(lipo -archs "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.${CWA_ONNXRUNTIME_VERSION}.dylib")" \
                = "${{ matrix.ort_arch }}"
              ;;
            Linux)
              test -s "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.${CWA_ONNXRUNTIME_VERSION}"
              test -L "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.1"
              test "$(readlink "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.1")" \
                = "libonnxruntime.so.${CWA_ONNXRUNTIME_VERSION}"
              file "${CWA_ONNXRUNTIME_ROOT}/lib/libonnxruntime.so.${CWA_ONNXRUNTIME_VERSION}" \
                | grep -F 'x86-64'
              ;;
          esac
      - name: Install Qt
        id: install_qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          arch: ${{ matrix.qt-arch }}
          modules: qtserialport qtmultimedia qtwebsockets qttasktree
          cache: true
          aqtsource: ${{ matrix.aqt_source }}
      - name: Retry Qt installation from a clean uncached directory
        id: install_qt_retry
        if: steps.install_qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          dir: ${{ runner.temp }}/Qt-retry
          version: "6.11.2"
          arch: ${{ matrix.qt-arch }}
          modules: qtserialport qtmultimedia qtwebsockets qttasktree
          cache: false
          aqtsource: ${{ matrix.aqt_source }}
          aqtversion: ==3.3.0
          py7zrversion: ==1.0.0
          extra: --external 7z
      - name: Prepare direct SDR runtime on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install soapysdr soapyrtlsdr
          module_root="$(brew --prefix soapyrtlsdr)/lib/SoapySDR"
          module_list="${RUNNER_TEMP}/cw-buddy-rtlsdr-modules.txt"
          find "${module_root}" -type f -name 'librtlsdrSupport.so' \
            -print > "${module_list}"
          module_count="$(wc -l < "${module_list}" | tr -d ' ')"
          if [[ "${module_count}" -ne 1 ]]; then
            echo "Expected one RTL-SDR Soapy module; found ${module_count}." >&2
            exit 1
          fi
          rtl_module="$(head -n 1 "${module_list}")"

          license_root="${RUNNER_TEMP}/cw-buddy-sdr-runtime-licenses"
          mkdir -p "${license_root}"
          : > "${license_root}/BUILD_PROVENANCE"
          for formula in soapysdr soapyrtlsdr librtlsdr libusb; do
            metadata="$(brew info --json=v2 "${formula}")"
            version="$(jq -r '.formulae[0].versions.stable' <<<"${metadata}")"
            source_url="$(jq -r '.formulae[0].urls.stable.url' <<<"${metadata}")"
            source_sha="$(jq -r '.formulae[0].urls.stable.checksum' <<<"${metadata}")"
            archive="${RUNNER_TEMP}/${formula}-${version}.source"
            source_dir="${RUNNER_TEMP}/${formula}-${version}-source"
            curl --fail --location --retry 3 --output "${archive}" "${source_url}"
            echo "${source_sha}  ${archive}" | shasum -a 256 -c -
            rm -rf "${source_dir}"
            mkdir -p "${source_dir}"
            tar -xf "${archive}" -C "${source_dir}"
            license_files=()
            while IFS= read -r license_path; do
              license_files+=("${license_path}")
            done < <(find "${source_dir}" -maxdepth 3 -type f \
              \( -iname 'license*' -o -iname 'copying*' \) -print | sort)
            if [[ "${#license_files[@]}" -lt 1 ]]; then
              echo "No license file found in verified ${formula} source." >&2
              exit 1
            fi
            cp "${license_files[0]}" \
              "${license_root}/${formula}-$(basename "${license_files[0]}")"
            printf '%s\n' \
              "${formula}=${version}" \
              "${formula}_source_sha256=${source_sha}" \
              >> "${license_root}/BUILD_PROVENANCE"
          done
          soapy_cmake_dir="$(brew --prefix soapysdr)/lib/cmake/SoapySDR"
          echo "CWA_MACOS_SDR_CONFIGURE_ARGUMENTS=-DCWA_ENABLE_SOAPY_SDR=ON -DSoapySDR_DIR=${soapy_cmake_dir} -DCWA_SOAPY_SDR_MODULE=${rtl_module} -DCWA_SOAPY_SDR_LICENSE_DIR=${license_root}" \
            >> "${GITHUB_ENV}"
      - name: Configure desktop
        id: configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCWA_BUILD_APP=OFF \
            -DCWA_BUILD_DESKTOP=ON \
            -DCWA_BUILD_TESTS=ON \
            -DCWA_ENABLE_ONNX_CHARACTER_DECODER=ON \
            -DCWA_ENABLE_SOAPY_SDR=${{ matrix.windows_installer }} \
            -DSoapySDR_DIR="${{ env.CWA_SOAPYSDR_ROOT }}/cmake" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            -DCWA_SOAPY_SDR_RUNTIME_ROOT="${{ env.CWA_SOAPYSDR_ROOT }}" \
            -DCWA_ONNXRUNTIME_ROOT="${{ env.CWA_ONNXRUNTIME_ROOT }}" \
            -DCWA_PACKAGE_REVISION=${{ github.run_number }} \
            ${{ matrix.sdr_configure_arguments }} \
            ${CWA_MACOS_SDR_CONFIGURE_ARGUMENTS:-} \
            ${{ matrix.configure-arguments }} \
            2>&1 | tee configure-output.log
      - name: Build desktop and core tests
        id: build
        shell: bash
        run: cmake --build build --config Release --parallel 2>&1 | tee build-output.log
      - name: Run dependency-free tests
        id: test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test-output.log
      - name: Stage self-contained application
        id: install
        run: cmake --install build --config Release --prefix stage
      - name: Verify staged platform layout
        id: verify_stage
        shell: bash
        run: |
          set -euo pipefail
          test -s build/cw-buddy-version.txt
          build_version="$(tr -d '\r\n' < build/cw-buddy-version.txt)"
          echo "Expected canonical version: ${build_version}"
          ort_license_dir=stage/share/doc/cw-buddy/third-party/onnxruntime
          test -s "${ort_license_dir}/LICENSE"
          test -s "${ort_license_dir}/Privacy.md"
          test -s "${ort_license_dir}/ThirdPartyNotices.txt"
          cmp "${CWA_ONNXRUNTIME_ROOT}/LICENSE" "${ort_license_dir}/LICENSE"
          cmp "${CWA_ONNXRUNTIME_ROOT}/Privacy.md" "${ort_license_dir}/Privacy.md"
          cmp "${CWA_ONNXRUNTIME_ROOT}/ThirdPartyNotices.txt" \
            "${ort_license_dir}/ThirdPartyNotices.txt"
          case "${RUNNER_OS}" in
            Windows)
              installed_version_file=stage/share/doc/cw-buddy/VERSION
              test -s "${installed_version_file}"
              cmp build/cw-buddy-version.txt "${installed_version_file}"
              test -f stage/bin/cw-buddy-desktop.exe
              test -f stage/bin/onnxruntime.dll
              test -f stage/bin/SoapySDR.dll
              test -f stage/bin/rtlsdr.dll
              test -f stage/bin/libusb-1.0.dll
              test -f stage/bin/pthreadVC3.dll
              test -f stage/lib/SoapySDR/modules0.8/rtlsdrSupport.dll
              test -f stage/share/doc/cw-buddy/third-party/sdr/BUILD_PROVENANCE
              test -f stage/share/doc/cw-buddy/third-party/sdr/soapysdr/LICENSE_1_0.txt
              test -f stage/share/doc/cw-buddy/third-party/sdr/soapyrtlsdr/LICENSE.txt
              test -f stage/share/doc/cw-buddy/third-party/sdr/rtlsdr/copyright
              test -f stage/share/doc/cw-buddy/third-party/sdr/libusb/copyright
              test -f stage/share/doc/cw-buddy/third-party/sdr/pthreads/copyright
              executable_version="$(powershell.exe -NoProfile -Command \
                "(Get-Item 'stage/bin/cw-buddy-desktop.exe').VersionInfo.ProductVersion" \
                | tr -d '\r\n')"
              echo "Windows executable ProductVersion: ${executable_version}"
              test "${executable_version}" = "${build_version}"
              ;;
            macOS)
              app_binary=stage/cw-buddy-desktop.app/Contents/MacOS/cw-buddy-desktop
              installed_version_file=stage/cw-buddy-desktop.app/Contents/Resources/VERSION
              test -s "${installed_version_file}"
              cmp build/cw-buddy-version.txt "${installed_version_file}"
              test -x "${app_binary}"
              test -f stage/cw-buddy-desktop.app/Contents/Frameworks/libonnxruntime.1.dylib
              otool -L "${app_binary}" | grep -F '@rpath/libonnxruntime.1.dylib'
              sdr_plugin_dir=stage/cw-buddy-desktop.app/Contents/PlugIns/SoapySDR
              sdr_plugin_list="${RUNNER_TEMP}/cw-buddy-staged-rtlsdr-modules.txt"
              find "${sdr_plugin_dir}" -type f \
                -name 'librtlsdrSupport.so' -print > "${sdr_plugin_list}"
              test "$(wc -l < "${sdr_plugin_list}" | tr -d ' ')" -eq 1
              sdr_plugin="$(head -n 1 "${sdr_plugin_list}")"
              find stage/cw-buddy-desktop.app/Contents/Frameworks \
                -type f -name 'libSoapySDR*.dylib' | grep -q .
              find stage/cw-buddy-desktop.app/Contents/Frameworks \
                -type f -name 'librtlsdr*.dylib' | grep -q .
              find stage/cw-buddy-desktop.app/Contents/Frameworks \
                -type f -name 'libusb-*.dylib' | grep -q .
              {
                otool -L "${app_binary}"
                while IFS= read -r -d '' binary; do
                  if file "${binary}" | grep -q 'Mach-O'; then
                    otool -L "${binary}"
                  fi
                done < <(find \
                  stage/cw-buddy-desktop.app/Contents/Frameworks \
                  "${sdr_plugin_dir}" -type f -print0)
              } | tee macos-sdr-links.log
              ! grep -E '/(opt/homebrew|usr/local)/' macos-sdr-links.log
              sdr_license_dir=stage/share/doc/cw-buddy/third-party/sdr-runtime
              test -s "${sdr_license_dir}/BUILD_PROVENANCE"
              for dependency in soapysdr soapyrtlsdr librtlsdr libusb; do
                grep -Eq "^${dependency}=" \
                  "${sdr_license_dir}/BUILD_PROVENANCE"
                find "${sdr_license_dir}" -type f \
                  -name "${dependency}-*" | grep -q .
              done
              xcrun vtool -show-build "${app_binary}" | grep -Eq 'minos +14\.0'
              cmake \
                -DCWA_APP_BUNDLE="$PWD/stage/cw-buddy-desktop.app" \
                -DCWA_EXPECTED_VERSION="${build_version}" \
                -P cmake/VerifyMacOSBundle.cmake
              ;;
            Linux)
              installed_version_file=stage/share/doc/cw-buddy/VERSION
              test -s "${installed_version_file}"
              cmp build/cw-buddy-version.txt "${installed_version_file}"
              test -x stage/bin/cw-buddy-desktop
              test -f stage/lib/cw-buddy/libonnxruntime.so.1
              readelf -d stage/bin/cw-buddy-desktop | grep -F 'libonnxruntime.so.1'
              readelf -d stage/bin/cw-buddy-desktop | grep -F 'libSoapySDR.so.0.8'
              ;;
          esac
      - name: Smoke-test staged application with native graphics
        id: smoke_stage
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Windows)
              stage/bin/cw-buddy-desktop.exe --sdr-backend-smoke-test
              stage/bin/cw-buddy-desktop.exe --profile ci-native-smoke --smoke-test
              ;;
            macOS)
              stage/cw-buddy-desktop.app/Contents/MacOS/cw-buddy-desktop --profile ci-native-smoke --smoke-test
              stage/cw-buddy-desktop.app/Contents/MacOS/cw-buddy-desktop \
                --sdr-backend-smoke-test
              ;;
            Linux)
              QT_QPA_PLATFORM=offscreen \
                stage/bin/cw-buddy-desktop --sdr-backend-smoke-test
              xvfb-run -a stage/bin/cw-buddy-desktop --profile ci-native-smoke --smoke-test
              ;;
          esac
      - name: Assemble and verify portable Linux SDR runtime
        id: bundle_linux_sdr
        if: runner.os == 'Linux' && matrix.portable_archive
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee portable-linux-sdr-bundle.log) 2>&1
          portable_root=portable-stage/stage
          cmake -E make_directory portable-stage
          cmake -E copy_directory stage "${portable_root}"

          app="${portable_root}/bin/cw-buddy-desktop"
          mv "${app}" "${app}.bin"
          cmake -E copy \
            src/desktop/packaging/linux/cw-buddy-portable-launcher.sh "${app}"
          chmod 0755 "${app}" "${app}.bin"

          module_path="$(dpkg -L soapysdr0.8-module-rtlsdr \
            | grep -E '/librtlsdrSupport\.so$' | head -n 1)"
          test -f "${module_path}"
          module_leaf="$(basename "$(dirname "${module_path}")")"
          bundled_module_dir="${portable_root}/lib/SoapySDR/${module_leaf}"
          cmake -E make_directory "${bundled_module_dir}"
          cp -L "${module_path}" \
            "${bundled_module_dir}/librtlsdrSupport.so"

          runtime_dir="${portable_root}/lib/cw-buddy"
          cmake -E make_directory "${runtime_dir}"
          copy_linked_library() {
            local subject=$1
            local expression=$2
            local entry
            entry="$(ldd "${subject}" | awk -v expression="${expression}" \
              '$1 ~ expression && $2 == "=>" { print $1 " " $3; exit }')"
            test -n "${entry}"
            local soname=${entry%% *}
            local resolved=${entry#* }
            test -f "${resolved}"
            cp -L "${resolved}" "${runtime_dir}/${soname}"
          }
          copy_linked_library "${app}.bin" '^libSoapySDR\.so'
          copy_linked_library "${module_path}" '^librtlsdr\.so'
          copy_linked_library "${module_path}" '^libusb-1\.0\.so'
          copy_linked_library "${runtime_dir}/libusb-1.0.so.0" '^libudev\.so'
          copy_linked_library "${runtime_dir}/libudev.so.1" '^libcap\.so'

          notice_root="${portable_root}/share/doc/cw-buddy/third-party"
          for package in libsoapysdr0.8 soapysdr0.8-module-rtlsdr \
                         librtlsdr2 libusb-1.0-0 libudev1 libcap2; do
            copyright="/usr/share/doc/${package}/copyright"
            test -s "${copyright}"
            cmake -E make_directory "${notice_root}/${package}"
            cmake -E copy "${copyright}" "${notice_root}/${package}/copyright"
          done

          test -x "${app}"
          test -x "${app}.bin"
          test -s "${bundled_module_dir}/librtlsdrSupport.so"
          test -s "${runtime_dir}/libSoapySDR.so.0.8"
          test -s "${runtime_dir}/librtlsdr.so.2"
          test -s "${runtime_dir}/libusb-1.0.so.0"
          test -s "${runtime_dir}/libudev.so.1"
          test -s "${runtime_dir}/libcap.so.2"
          readelf -d "${bundled_module_dir}/librtlsdrSupport.so" \
            | grep -F 'librtlsdr.so.2'
          readelf -d "${bundled_module_dir}/librtlsdrSupport.so" \
            | grep -F 'libSoapySDR.so.0.8'
          readelf -d "${runtime_dir}/librtlsdr.so.2" \
            | grep -F 'libusb-1.0.so.0'
          readelf -d "${runtime_dir}/libusb-1.0.so.0" \
            | grep -F 'libudev.so.1'
          readelf -d "${runtime_dir}/libudev.so.1" \
            | grep -F 'libcap.so.2'
          : > portable-linux-ldd.log
          : > portable-linux-sdr-ldd.log
          LD_LIBRARY_PATH="${runtime_dir}" ldd "${app}.bin" \
            >> portable-linux-ldd.log
          for elf in \
            "${bundled_module_dir}/librtlsdrSupport.so" \
            "${runtime_dir}/libSoapySDR.so.0.8" \
            "${runtime_dir}/librtlsdr.so.2" \
            "${runtime_dir}/libusb-1.0.so.0" \
            "${runtime_dir}/libudev.so.1" \
            "${runtime_dir}/libcap.so.2"; do
            LD_LIBRARY_PATH="${runtime_dir}" ldd "${elf}" \
              >> portable-linux-sdr-ldd.log
          done
          cat portable-linux-sdr-ldd.log >> portable-linux-ldd.log
          ! grep -F 'not found' portable-linux-ldd.log
          while read -r soname arrow resolved remainder; do
            if [[ "${arrow}" != "=>" || "${resolved}" != /* ]]; then
              continue
            fi
            case "${soname}" in
              libc.so.*|libm.so.*|libdl.so.*|librt.so.*|libpthread.so.*|\
              libstdc++.so.*|libgcc_s.so.*)
                continue
                ;;
            esac
            echo "Unexpected external SDR runtime dependency: ${soname} => ${resolved}" >&2
            exit 1
          done < portable-linux-sdr-ldd.log

          # Soapy normally searches its compiled system prefix before the
          # plugin path. Give only this probe an empty root so success proves
          # the module copied into the archive actually loads. The wrapper
          # leaves the normal root untouched for real launches, preserving
          # system-installed vendor modules such as SoapySDRPlay3.
          isolated_soapy_root="${RUNNER_TEMP}/cw-buddy-empty-soapy-root"
          cmake -E make_directory "${isolated_soapy_root}"
          SOAPY_SDR_ROOT="${isolated_soapy_root}" QT_QPA_PLATFORM=offscreen \
            "${app}" --sdr-backend-smoke-test
          xvfb-run -a "${app}" --profile ci-portable-sdr-smoke --smoke-test
      - name: Preserve the staged application as an archive
        id: archive
        if: matrix.portable_archive
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            (cd portable-stage && cmake -E tar czf \
              ../${{ matrix.artifact }}.tar.gz --format=gnutar stage)
          else
            cmake -E tar czf ${{ matrix.artifact }}.tar.gz --format=gnutar stage
          fi
      - name: Publish downloadable build
        id: upload
        if: matrix.portable_archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build upgrade-capable Windows installer
        id: build_windows_installer
        if: matrix.windows_installer
        shell: bash
        run: cpack --config build/CPackConfig.cmake -G WIX -B packages 2>&1 | tee cpack-wix.log
      - name: Verify Windows installer finish-page launch behavior
        id: verify_windows_installer
        if: matrix.windows_installer
        shell: pwsh
        run: |
          try {
            & ./src/desktop/packaging/windows/VerifyWindowsInstaller.ps1 `
              -PackageDirectory packages 2>&1 |
                Tee-Object -FilePath windows-installer-verification.log
          }
          catch {
            $_ | Out-String |
              Tee-Object -FilePath windows-installer-verification.log -Append
            throw
          }
      - name: Publish Windows installer
        id: upload_windows_installer
        if: matrix.windows_installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Build Debian/Ubuntu package
        id: build_deb
        if: matrix.debian_package
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B packages
          build_version="$(tr -d '\r\n' < build/cw-buddy-version.txt)"
          deb_packages=(packages/*.deb)
          test "${#deb_packages[@]}" -eq 1
          test "$(dpkg-deb -f "${deb_packages[0]}" Version)" = "${build_version}-1"
          dpkg-deb -f "${deb_packages[0]}" Depends \
            | tee debian-dependencies.txt
          grep -Eq '(^|, )soapysdr-module-rtlsdr([, ]|$)' \
            debian-dependencies.txt
          dpkg-deb --contents "${deb_packages[0]}" \
            | grep -F './usr/bin/cw-buddy-desktop'
          cmake -E copy build/cw-buddy-version.txt packages/cw-buddy-version.txt
      - name: Publish Debian/Ubuntu package
        id: upload_deb
        if: matrix.debian_package
        uses: actions/upload-artifact@v7
        with:
          name: cw-buddy-debian-ubuntu-x64
          path: |
            packages/*.deb
            packages/cw-buddy-version.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish SSH-queryable job result
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CWA_MARKER: ${{ matrix.marker }}
          CWA_QT_RESULT: ${{ steps.install_qt.outcome }}
          CWA_QT_RETRY_RESULT: ${{ steps.install_qt_retry.outcome }}
          CWA_ORT_CACHE_RESULT: ${{ steps.cache_onnxruntime.outcome }}
          CWA_ORT_CHECKOUT_RESULT: ${{ steps.checkout_onnxruntime.outcome }}
          CWA_ORT_BUILD_POSIX_RESULT: ${{ steps.build_onnxruntime_posix.outcome }}
          CWA_ORT_DOWNLOAD_WINDOWS_RESULT: ${{ steps.download_onnxruntime_windows.outcome }}
          CWA_ORT_NORMALIZE_POSIX_RESULT: ${{ steps.normalize_onnxruntime_posix.outcome }}
          CWA_ORT_NORMALIZE_WINDOWS_RESULT: ${{ steps.normalize_onnxruntime_windows.outcome }}
          CWA_ORT_VERIFY_RESULT: ${{ steps.verify_onnxruntime.outcome }}
          CWA_CONFIGURE_RESULT: ${{ steps.configure.outcome }}
          CWA_BUILD_RESULT: ${{ steps.build.outcome }}
          CWA_TEST_RESULT: ${{ steps.test.outcome }}
          CWA_INSTALL_RESULT: ${{ steps.install.outcome }}
          CWA_VERIFY_STAGE_RESULT: ${{ steps.verify_stage.outcome }}
          CWA_STAGE_SMOKE_RESULT: ${{ steps.smoke_stage.outcome }}
          CWA_LINUX_SDR_INSTALL_RESULT: ${{ steps.install_linux_sdr.outcome }}
          CWA_LINUX_SDR_BUNDLE_RESULT: ${{ steps.bundle_linux_sdr.outcome }}
          CWA_WINDOWS_SDR_BUILD_RESULT: ${{ steps.build_windows_sdr.outcome }}
          CWA_WINDOWS_SDR_VERIFY_RESULT: ${{ steps.verify_windows_sdr.outcome }}
          CWA_ARCHIVE_RESULT: ${{ steps.archive.outcome }}
          CWA_UPLOAD_RESULT: ${{ steps.upload.outcome }}
          CWA_WINDOWS_INSTALLER_RESULT: ${{ steps.build_windows_installer.outcome }}
          CWA_WINDOWS_VERIFY_RESULT: ${{ steps.verify_windows_installer.outcome }}
          CWA_WINDOWS_UPLOAD_RESULT: ${{ steps.upload_windows_installer.outcome }}
          CWA_DEB_RESULT: ${{ steps.build_deb.outcome }}
          CWA_DEB_UPLOAD_RESULT: ${{ steps.upload_deb.outcome }}
        run: |
          status_tag="ci-status/${CWA_MARKER}-${GITHUB_SHA}"
          status_message="ort_cache=${CWA_ORT_CACHE_RESULT} ort_checkout=${CWA_ORT_CHECKOUT_RESULT} ort_build_posix=${CWA_ORT_BUILD_POSIX_RESULT} ort_download_windows=${CWA_ORT_DOWNLOAD_WINDOWS_RESULT} ort_normalize_posix=${CWA_ORT_NORMALIZE_POSIX_RESULT} ort_normalize_windows=${CWA_ORT_NORMALIZE_WINDOWS_RESULT} ort_verify=${CWA_ORT_VERIFY_RESULT} qt=${CWA_QT_RESULT} qt_retry=${CWA_QT_RETRY_RESULT} linux_sdr_install=${CWA_LINUX_SDR_INSTALL_RESULT} windows_sdr_build=${CWA_WINDOWS_SDR_BUILD_RESULT} windows_sdr_verify=${CWA_WINDOWS_SDR_VERIFY_RESULT} configure=${CWA_CONFIGURE_RESULT} build=${CWA_BUILD_RESULT} test=${CWA_TEST_RESULT} install=${CWA_INSTALL_RESULT} verify_stage=${CWA_VERIFY_STAGE_RESULT} stage_smoke=${CWA_STAGE_SMOKE_RESULT} linux_sdr_bundle=${CWA_LINUX_SDR_BUNDLE_RESULT} archive=${CWA_ARCHIVE_RESULT} upload=${CWA_UPLOAD_RESULT} win_installer=${CWA_WINDOWS_INSTALLER_RESULT} win_verify=${CWA_WINDOWS_VERIFY_RESULT} win_upload=${CWA_WINDOWS_UPLOAD_RESULT} deb=${CWA_DEB_RESULT} deb_upload=${CWA_DEB_UPLOAD_RESULT}"
          if [[ "${CWA_ORT_BUILD_POSIX_RESULT}" == "failure" ]]; then
            ort_log="$(tail -n 30 "${CWA_ONNXRUNTIME_SOURCE}/onnxruntime-build.log" 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${ort_log}" ]]; then
              status_message="${status_message}"$'\n'"ort_log=${ort_log}"
            fi
          fi
          if [[ "${CWA_QT_RESULT}" == "failure" ]]; then
            qt_log="$(find "${GITHUB_WORKSPACE}" -type f -name aqtinstall.log -exec tail -n 20 {} \; 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${qt_log}" ]]; then
              status_message="${status_message}"$'\n'"qt_log=${qt_log}"
            fi
          fi
          if [[ "${CWA_WINDOWS_INSTALLER_RESULT}" == "failure" ]]; then
            wix_log="$(tail -n 30 cpack-wix.log 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${wix_log}" ]]; then
              status_message="${status_message}"$'\n'"wix_log=${wix_log}"
            fi
          fi
          if [[ "${CWA_WINDOWS_SDR_BUILD_RESULT}" == "failure" ]]; then
            windows_sdr_log="$(grep -Ei 'CMake (Error|Deprecation Error)|error C[0-9]+:|fatal error:|Native command failed' windows-sdr-build.log 2>/dev/null | tail -n 40 | tr '\r\n' '  ' | tail -c 3000)"
            status_message="${status_message}"$'\n'"windows_sdr_log=${windows_sdr_log:-unavailable}"
          fi
          if [[ "${CWA_LINUX_SDR_BUNDLE_RESULT}" == "failure" ]]; then
            linux_sdr_log="$(tail -n 80 portable-linux-sdr-bundle.log 2>/dev/null | tr '\r\n' '  ' | tail -c 3000)"
            if [[ -n "${linux_sdr_log}" ]]; then
              status_message="${status_message}"$'\n'"linux_sdr_log=${linux_sdr_log}"
            fi
          fi
          if [[ "${CWA_WINDOWS_VERIFY_RESULT}" == "failure" ]]; then
            verify_log="$(tail -n 30 windows-installer-verification.log 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${verify_log}" ]]; then
              status_message="${status_message}"$'\n'"win_verify_log=${verify_log}"
            fi
          fi
          if [[ "${CWA_CONFIGURE_RESULT}" == "failure" ]]; then
            configure_log="$(grep -Ei 'CMake (Error|Deprecation Error)|Could NOT find|not found|does not exist|unknown argument' configure-output.log 2>/dev/null | tail -n 40 | tr '\r\n' '  ' | tail -c 3000)"
            status_message="${status_message}"$'\n'"configure_log=${configure_log:-unavailable}"
          fi
          if [[ "${CWA_BUILD_RESULT}" == "failure" ]]; then
            build_errors="$(grep -Ei 'error (C|LNK)[0-9]+:|fatal error:|CMake Error|undefined reference|ninja: build stopped|MSB[0-9]+: error' build-output.log 2>/dev/null | tail -n 24 | tr '\r\n' '  ' | tail -c 3000 || true)"
            if [[ -n "${build_errors}" ]]; then
              status_message="${status_message}"$'\n'"build_errors=${build_errors}"
            fi
            build_log="$(tail -n 20 build-output.log 2>/dev/null | tr '\r\n' '  ' | tail -c 1800)"
            if [[ -n "${build_log}" ]]; then
              status_message="${status_message}"$'\n'"build_log=${build_log}"
            fi
          fi
          if [[ "${CWA_TEST_RESULT}" == "failure" ]]; then
            test_log="$(tail -n 45 test-output.log 2>/dev/null | tr '\r\n' '  ' | tail -c 4000)"
            if [[ -n "${test_log}" ]]; then
              status_message="${status_message}"$'\n'"test_log=${test_log}"
            fi
          fi
          git config user.name "CW Buddy CI"
          git config user.email "ci@cw-buddy.invalid"
          printf '%s\n' "${status_message}" > ci-status-message.txt
          git tag --force --annotate "${status_tag}" --file ci-status-message.txt
          for attempt in 1 2 3 4; do
            if git push origin "refs/tags/${status_tag}" --force; then
              break
            fi
            if [[ "${attempt}" == "4" ]]; then
              echo "Unable to publish ${status_tag} after ${attempt} attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

  publish-continuous-release:
    name: Publish continuous binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-desktop
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out binary index
        uses: actions/checkout@v7
      - name: Download every successful platform package
        id: download
        uses: actions/download-artifact@v8
        with:
          pattern: cw-buddy-*
          path: release-assets
          merge-multiple: true
      - name: Normalize names and generate integrity metadata
        id: normalize
        shell: bash
        run: |
          shopt -s nullglob
          deb_packages=(release-assets/*.deb)
          if (( ${#deb_packages[@]} != 1 )); then
            echo "Expected exactly one Debian package; found ${#deb_packages[@]}." >&2
            exit 1
          fi
          mv "${deb_packages[0]}" release-assets/cw-buddy-debian-ubuntu-x64.deb
          windows_installers=(release-assets/*.msi)
          if (( ${#windows_installers[@]} != 1 )); then
            echo "Expected exactly one Windows installer; found ${#windows_installers[@]}." >&2
            exit 1
          fi
          mv "${windows_installers[0]}" release-assets/cw-buddy-windows11-x64.msi
          if [[ ! -f release-assets/cw-buddy-version.txt ]]; then
            echo "The canonical build-version file is missing." >&2
            exit 1
          fi
          build_version="$(tr -d '\r\n' < release-assets/cw-buddy-version.txt)"
          if [[ ! "${build_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid canonical build version: ${build_version}" >&2
            exit 1
          fi
          jq --arg version "${build_version}" \
            '.version = $version' binaries/latest.json \
            > release-assets/latest.json
          rm release-assets/cw-buddy-version.txt
          (
            cd release-assets
            sha256sum cw-buddy-* | sort -k2 > SHA256SUMS
          )
      - name: Write continuous-release notes
        id: notes
        shell: bash
        run: |
          {
            echo "Automated, unsigned development builds from commit ${GITHUB_SHA}."
            echo
            echo "Every platform build and the core tests passed before these assets were published."
            echo "Use SHA256SUMS to verify the downloaded payload."
          } > continuous-release-notes.md
      - name: Create or update continuous prerelease
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upload_with_retry() {
            local attempt=1
            local maximum_attempts=5
            local delay_seconds

            while ! gh release upload continuous "$@" --clobber; do
              if (( attempt >= maximum_attempts )); then
                echo "Release asset upload failed after ${maximum_attempts} attempts." >&2
                return 1
              fi
              delay_seconds=$((attempt * 5))
              echo "Release asset replacement has not settled; retrying in ${delay_seconds}s." >&2
              sleep "${delay_seconds}"
              attempt=$((attempt + 1))
            done
          }

          if gh release view continuous >/dev/null 2>&1; then
            payloads=()
            for asset in release-assets/*; do
              if [[ "$(basename "${asset}")" != "latest.json" ]]; then
                payloads+=("${asset}")
              fi
            done
            upload_with_retry "${payloads[@]}"
            # Keep the previous manifest reachable while large platform
            # artifacts are replaced. The new manifest becomes the final,
            # pointer to the completed release set.
            upload_with_retry release-assets/latest.json
            gh release edit continuous \
              --title "Continuous development builds" \
              --notes-file continuous-release-notes.md \
              --prerelease \
              --latest=false
          else
            gh release create continuous release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "Continuous development builds" \
              --notes-file continuous-release-notes.md \
              --prerelease \
              --latest=false
          fi
      - name: Publish release failure result
        if: failure()
        shell: bash
        env:
          CWA_DOWNLOAD_RESULT: ${{ steps.download.outcome }}
          CWA_NORMALIZE_RESULT: ${{ steps.normalize.outcome }}
          CWA_NOTES_RESULT: ${{ steps.notes.outcome }}
          CWA_RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          status_tag="ci-status/release-${GITHUB_SHA}"
          status_message="download=${CWA_DOWNLOAD_RESULT} normalize=${CWA_NORMALIZE_RESULT} notes=${CWA_NOTES_RESULT} release=${CWA_RELEASE_RESULT}"
          git config user.name "CW Buddy CI"
          git config user.email "ci@cw-buddy.invalid"
          git tag --force --annotate "${status_tag}" --message "${status_message}"
          git push origin "refs/tags/${status_tag}" --force
      - name: Mark the fully verified commit
        shell: bash
        run: |
          git tag --force continuous "${GITHUB_SHA}"
          git push origin refs/tags/continuous --force
          for marker in windows11-x64 linux-x64 macos-arm64 macos-x64 release; do
            git push origin --delete "refs/tags/ci-status/${marker}-${GITHUB_SHA}" 2>/dev/null || true
          done
